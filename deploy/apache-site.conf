ServerTokens Prod

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /srv/erp/public
    ServerSignature Off

    <Directory /srv/erp/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
